<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#05010f" />
<title>NEON DASH</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>

  <!-- In-game HUD -->
  <div id="hud" class="hidden">
    <div id="progressWrap">
      <div id="progressBar"><div id="progressFill"></div></div>
      <div id="pctLabel">0%</div>
    </div>
    <div id="attemptLabel">Attempt 1</div>
  </div>

  <!-- Sound toggle (always visible) -->
  <button id="soundBtn" class="icon-btn" aria-label="Toggle sound" title="Toggle sound (M)">
    <span id="soundIcon">&#128263;</span>
  </button>

  <!-- Pause button (in-game) -->
  <button id="pauseBtn" class="icon-btn hidden" aria-label="Pause" title="Pause (P)">
    <span>&#10073;&#10073;</span>
  </button>

  <!-- Start / menu overlay -->
  <div id="menu" class="overlay">
    <div class="menu-inner">
      <div class="brand">
        <p class="menu-kicker">◆ THE NEON RUN STARTS HERE ◆</p>
        <h1 class="title" data-text="NEON DASH">NEON DASH</h1>
        <p class="tagline">A rhythm-action neon gauntlet</p>
        <p class="menu-edition">12 CUBE DESIGNS <span>•</span> 4 NEON WORLDS</p>
      </div>

      <div class="glass-card mode-card">
        <div class="mode-row">
          <button id="playStage" class="big-btn stage-btn">
            <span class="btn-icon">&#9654;</span>
            <span class="btn-title">LEVELS</span>
            <span class="btn-sub">Choose and play a level</span>
            <span class="btn-best" id="stageHighscore">HIGH SCORE · 0%</span>
          </button>
          <button id="playEndless" class="big-btn endless-btn">
            <span class="btn-icon">&#8734;</span>
            <span class="btn-title">ENDLESS</span>
            <span class="btn-sub">Procedural &middot; escalating</span>
            <span class="btn-best" id="endlessHighscore">HIGH SCORE · 0m</span>
          </button>
        </div>
      </div>

      <div id="levelsPanel" class="levels-panel hidden">
        <div class="levels-panel-head"><span>SELECT A LEVEL</span><button id="closeLevels" class="levels-close" type="button">BACK</button></div>
        <div class="level-select" aria-label="Choose a level">
          <button class="level-choice" data-level="0"><b>01</b><span>STEREO PULSE</span><small>CLASSIC</small></button>
          <button class="level-choice" data-level="1"><b>02</b><span>NEON RUSH</span><small>ADVANCED</small></button>
          <button class="level-choice" data-level="2"><b>03</b><span>GRAVITY BREAK</span><small>EXPERT</small></button>
          <button class="level-choice" data-level="3"><b>04</b><span>SKYLINE SHIFT</span><small>EXPERT+</small></button>
        </div>
      </div>

      <div class="glass-card panel">
        <div class="panel-head"><span>CUBE SKINS</span><span class="panel-count">12 DESIGNS</span></div>
        <div class="skin-stage">
          <canvas id="skinPreview" width="220" height="220"></canvas>
          <div class="skin-stage-glow"></div>
        </div>
        <div id="skins" class="skins"></div>
      </div>

      <div class="glass-card menu-foot">
        <label class="practice-row">
          <input type="checkbox" id="practiceToggle" />
          <span class="switch"></span>
          <span class="practice-label"><b>Practice Mode</b> <em>(auto-checkpoints)</em></span>
        </label>
        <div id="bestStats" class="best-stats"></div>
      </div>

      <div class="controls-hint glass-chip">
        <span><b>SPACE / W / &uarr; / CLICK</b> jump &amp; fly</span>
        <span><b>R</b> restart</span>
        <span><b>P</b> pause</span>
        <span><b>M</b> mute</span>
      </div>
    </div>
  </div>

  <!-- Pause overlay -->
  <div id="pause" class="overlay hidden">
    <div class="pause-inner glass-card">
      <h2>PAUSED</h2>
      <div class="mode-row">
        <button id="resumeBtn" class="big-btn stage-btn"><span class="btn-title">RESUME</span></button>
        <button id="restartBtn" class="big-btn endless-btn"><span class="btn-title">RESTART</span></button>
        <button id="quitBtn" class="big-btn ghost-btn"><span class="btn-title">MENU</span></button>
      </div>
    </div>
  </div>

  <!-- Victory overlay -->
  <div id="victory" class="overlay hidden">
    <div class="pause-inner glass-card victory-card">
      <h2 class="victory-title">STAGE CLEAR</h2>
      <p id="victoryStats" class="tagline"></p>
      <div class="mode-row">
        <button id="victoryMenuBtn" class="big-btn ghost-btn"><span class="btn-title">MENU</span></button>
        <button id="victoryReplayBtn" class="big-btn endless-btn"><span class="btn-title">REPLAY</span></button>
      </div>
    </div>
  </div>

  <div id="rotateHint" class="rotate-hint hidden">Rotate your device for the best experience</div>
</div>
<script src="game.js"></script>
</body>
</html>
